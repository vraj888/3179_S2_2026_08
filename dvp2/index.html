<!DOCTYPE html>
<html>
    <head>
        <title>DVP-2</title>
        <link rel="stylesheet" href="style.css">
        <script src="events.js"></script>

         <!-- Import Vega & Vega-Lite (does not have to be from CDN) -->
        <script src="https://cdn.jsdelivr.net/npm/vega@5.20.2"></script>
        <script src="https://cdn.jsdelivr.net/npm/vega-lite@5.1.0"></script>
        <script src="https://cdn.jsdelivr.net/npm/vega-embed@6.17.0"></script>

        <!-- Import pure.css -->
        <link rel="stylesheet" href="https://unpkg.com/purecss@2.0.3/build/pure-min.css"
            integrity="sha384-cg6SkqEOCV1NbJoCu11+bm0NvBRc8IYLRGXkmNrqUBfTjmMYwNKPWBTIKyw9mHNJ" crossorigin="anonymous">
        <meta name="viewport" content="width=device-width, initial-scale=1">
    </head>
    <body>
        <div class="page">
             <div class="row">
                <div class="pure-g">
                    <div class="pure-u-1-1">
                        <h1>Fossilisation process</h1>
                    </div>
                    <div class="pure-u-1-1">
                        <p>vis of the process</p>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="pure-g">
                    <div class="pure-u-1-2">
                        <div id="obsByAge" style="width:100%; min-height:300px;"></div>
                        <script type="text/javascript">
                            var spec2 = "js/occurence_by_period.vg.json";
                            vegaEmbed('#obsByAge', spec2)
                                .then(function(result) {
                                    // Access the Vega view instance (https://vega.github.io/vega/docs/api/view/) as result.view
                                })
                                .catch(console.error);
                        </script>
                    </div>
                    <div class="pure-u-1-2">
                        <h1>spiral chart of the geological time periods</h1>
                    </div>
                    
                </div>
            </div>
            <div class="row">
                <div class="pure-g">
                    <div class="pure-u-1-2">
                       
                    </div>
                    <div class="pure-u-1-2">
                        <div id="taxon-range" style="width:100%; min-height:300px;"></div>
                        <script type="text/javascript">
                            var spec2 = "js/taxon-range.vg.json";
                            vegaEmbed('#taxon-range', spec2)
                                .then(function(result) {
                                    // Access the Vega view instance (https://vega.github.io/vega/docs/api/view/) as result.view
                                })
                                .catch(console.error);
                        </script>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="pure-g">
                    <div class="pure-u-1-3">
                        <h1>annotations for the dynamic map Dynamic map</h1>
                    </div>
                    <div class="pure-u-1-3">
                        <h1>fossils proportional chart</h1>
                    </div>
                    <div class="pure-u-1-3">
                        <h1>annotations for the proportional chart</h1>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="pure-g">
                    <div class="pure-u-2-3">
                        <div id="lithology" style="width:100%; min-height:300px;"></div>
                        <script type="text/javascript">
                            var spec2 = "js/lithology.vg.json";
                            vegaEmbed('#lithology', spec2)
                                .then(function(result) {
                                    // Access the Vega view instance (https://vega.github.io/vega/docs/api/view/) as result.view
                                })
                                .catch(console.error);
                        </script>
                    </div>
                    <div class="pure-u-1-3">
                        <h1>Lithology annotations</h1>
                    </div>
                </div>
            </div>
            <div class="row">
                <div id="multiMap" style="width:100%; min-height:300px;"></div>
                        <script type="text/javascript">
                            var spec2 = "js/time-comparision.vg.json";
                            vegaEmbed('#multiMap', spec2)
                                .then(function(result) {
                                    // Access the Vega view instance (https://vega.github.io/vega/docs/api/view/) as result.view
                                })
                                .catch(console.error);
                        </script>
                <div id="heatMap" style="width:100%; min-height:300px;"></div>
                        <script type="text/javascript">
                            var spec2 = "js/latitude-heatmap.vg.json";
                            vegaEmbed('#heatMap', spec2)
                                .then(function(result) {
                                    // Access the Vega view instance (https://vega.github.io/vega/docs/api/view/) as result.view
                                })
                                .catch(console.error);
                        </script>
            </div>
            <div class="row">
                <div id="aus-hex" style="width:100%; min-height:300px;"></div>
                        <script type="text/javascript">
                            var spec2 = "js/aus-hex.vg.json";
                            vegaEmbed('#aus-hex', spec2)
                                .then(function(result) {
                                    // Access the Vega view instance (https://vega.github.io/vega/docs/api/view/) as result.view
                                })
                                .catch(console.error);
                        </script>
            </div>
        </div>
    </body>
</html>
